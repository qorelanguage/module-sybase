stages:
  - test

default:
  tags:
    - k8s
    - amd64
  before_script:
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST -u omusil24:${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e

variables:
  TDSVER: "7.4"
  REPO_NAME: module-sybase
  # MS SQL Server configuration
  ACCEPT_EULA: "Y"
  MSSQL_SA_PASSWORD: "Test1234!"
  MSSQL_PID: "Express"
  # Connection string using direct connection format
  QORE_DB_CONNSTR_FREETDS: 'freetds:sa/Test1234!@test%mssql:1433'

.wait_for_mssql: &wait_for_mssql |
  echo "Configuring freetds.conf..."
  # Create freetds.conf entry for the mssql service
  mkdir -p /etc/freetds
  printf "[mssql]\n\thost = mssql\n\tport = 1433\n\ttds version = 7.4\n" > /etc/freetds/freetds.conf
  cat /etc/freetds/freetds.conf
  echo "Waiting for MS SQL Server to start..."
  # Wait up to 120 seconds for MS SQL Server to be ready
  # Use tsql directly since nc/ping may not be available
  for i in $(seq 1 120); do
    if echo -e "SELECT 1\nGO" | tsql -S mssql -U sa -P 'Test1234!' 2>/dev/null | grep -q "1"; then
      echo "MS SQL Server is ready!"
      break
    fi
    if [ $i -eq 120 ]; then
      echo "ERROR: MS SQL Server did not become ready in time"
      # Try to get diagnostic info
      echo "Attempting tsql connection for diagnostics..."
      echo -e "SELECT 1\nGO" | tsql -S mssql -U sa -P 'Test1234!' 2>&1 || true
      exit 1
    fi
    echo "Waiting for MS SQL Server... ($i/120)"
    sleep 1
  done
  # Create test database
  echo "Creating test database..."
  echo -e "CREATE DATABASE test\nGO" | tsql -S mssql -U sa -P 'Test1234!' || echo "Database may already exist"

test-ubuntu:
  stage: test
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: mssql
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: "Test1234!"
        MSSQL_PID: "Express"
  script:
    - *wait_for_mssql
    - |
        # Run tests
        if test/docker_test/test-ubuntu.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST -u omusil24:${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST -u omusil24:${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi

